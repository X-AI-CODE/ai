<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家族修仙/官途 (Family Saga) — 微信小游戏测试预览</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b1118;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-header {
      width: 100%;
      max-width: 480px;
      padding: 8px 12px;
      background: #141f2b;
      border-bottom: 1px solid #d4af37;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .game-header h1 {
      font-size: 16px;
      color: #ffdf00;
      margin: 0;
    }
    .header-btns {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: #2e4a62;
      color: #ffffff;
      border: 1px solid #7a9a9a;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #3b6a88;
      border-color: #ffdf00;
    }
    .game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 800px;
      max-height: calc(100vh - 44px);
      background: #1a2e3b;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }
    #ui-overlay {
      z-index: 10;
      pointer-events: auto;
    }
    #main-canvas {
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="game-header">
    <h1>🏔 家族修仙 / 官途 — 微信小游戏 (预览测试)</h1>
    <div class="header-btns">
      <button class="btn" id="btn-audio">🔊 音频: 开</button>
      <button class="btn" id="btn-restart">🔄 删档重开</button>
    </div>
  </div>

  <div class="game-container" id="game-container">
    <canvas id="main-canvas"></canvas>
    <canvas id="ui-overlay"></canvas>
  </div>

  <script type="module">
    import gameMain from './game.js';
    import { StorageManager } from './src/storage/StorageManager.js';

    // 绑定顶部 Web 调试按钮
    const btnAudio = document.getElementById('btn-audio');
    btnAudio.addEventListener('click', () => {
      const enabled = gameMain.audioManager.toggleAudio();
      btnAudio.textContent = `🔊 音频: ${enabled ? '开' : '关'}`;
    });

    const btnRestart = document.getElementById('btn-restart');
    btnRestart.addEventListener('click', () => {
      if (confirm('确定要清空全部本地存档，重选“修仙/官途”路线开创全新周目吗？')) {
        StorageManager.deleteSave();
        location.reload();
      }
    });

    // 监听窗口缩放自适应尺寸
    window.addEventListener('resize', () => {
      const container = document.getElementById('game-container');
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (gameMain.sceneManager && gameMain.sceneManager.renderer) {
        gameMain.sceneManager.renderer.setSize(w, h, false);
        gameMain.sceneManager.camera.aspect = w / h;
        gameMain.sceneManager.camera.updateProjectionMatrix();
      }
      if (gameMain.uiManager) {
        gameMain.uiManager.width = w;
        gameMain.uiManager.height = h;
        gameMain.uiManager.overlayCanvas.width = w * gameMain.uiManager.pixelRatio;
        gameMain.uiManager.overlayCanvas.height = h * gameMain.uiManager.pixelRatio;
        gameMain.uiManager.ctx.scale(gameMain.uiManager.pixelRatio, gameMain.uiManager.pixelRatio);
        gameMain.uiManager.refreshHUD();
      }
    });
  </script>
</body>
</html>
